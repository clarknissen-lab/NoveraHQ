# Veröffentlicht widget/ als GitHub Page.
# Ergebnis-URL: https://<user>.github.io/<repo>/
#
# Diese Adresse kommt in NOVERA_CLOCK_URL. Der Builder holt daraus vier Dinge:
# Logo als Seiten-Icon, Ambiente-Cover, Uhr im Kopf und Fokus-Timer.
#
# Läuft auf main und auf den claude/*-Arbeitsbranches — sonst müsste man erst
# mergen, bevor man das Widget überhaupt sehen kann. Über "Run workflow" im
# Reiter Actions lässt er sich zusätzlich für jeden Branch von Hand starten.
name: Deploy widget to GitHub Pages

on:
  push:
    branches: [main, "claude/**"]
    paths: ["widget/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: widget
      - id: deployment
        uses: actions/deploy-pages@v4
