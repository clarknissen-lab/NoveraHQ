<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novera Studio — Fokus</title>
<link rel="icon" href="brand/favicon.svg">
<script>
  /* Läuft vor dem ersten Anstrich, damit kein Themenwechsel aufblitzt.
     ?theme=dark|light schlägt das System-Thema — nötig, weil das Embed
     Notions eigene Einstellung nicht lesen kann. */
  (function () {
    var w = new URLSearchParams(location.search).get("theme");
    var hell = w === "light" || (w !== "dark" &&
      window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.setAttribute("data-theme", hell ? "light" : "dark");
  })();
</script>
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal; font-weight: 100 900; font-display: swap;
    src: url('brand/inter-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal; font-weight: 400; font-display: swap;
    src: url('brand/instrument-serif-latin.woff2') format('woff2');
  }

  :root {
    color-scheme: dark;
    --void: #08090B; --slate: #12151A;
    --platinum: #E9ECEF; --silver: #98A1AD; --muted: #939CA8;
    --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
    --glow-soft: rgba(150,180,215,.15);
    --chrome-0:#FFFFFF; --chrome-1:#C3CAD4; --chrome-2:#868E99;
    --chrome-3:#E8ECF1; --chrome-4:#AAB2BD;
    --karte: linear-gradient(168deg, rgba(255,255,255,.045), rgba(255,255,255,0) 55%);
    /* Ambiente-Licht: Lila, Pink, Blau — weich und entsättigt, kein Neon.
       Das Blau liegt im Periwinkle-Bereich, weil ein Blau mit Cyan-Anteil
       gegen den dunklen Grund optisch ins Türkise kippt. */
    --amb-lila: rgba(172, 155, 242, .52);
    --amb-pink: rgba(244, 169, 218, .42);
    --amb-blau: rgba(147, 169, 242, .38);

    /* Dieselben Töne, stark abgeschwächt, für die Kartenfläche selbst.
       Die Karte deckt fast den ganzen Ausschnitt ab — läge das Licht nur
       außen herum, sähe man im Notion-Embed praktisch nichts davon.
       Niedrig genug, dass der Text unangetastet bleibt. */
    --amb-lila-in: rgba(172, 155, 242, .13);
    --amb-pink-in: rgba(244, 169, 218, .10);
    --amb-blau-in: rgba(147, 169, 242, .10);
  }
  /* Der Hellmodus der Marke dreht den Verlauf ins Graphit.
     Gesteuert über data-theme am <html> statt über prefers-color-scheme:
     In einem Notion-Embed meldet die Medienabfrage das System-Thema, nicht
     das von Notion. Wer Notion dunkel und das System hell nutzt, bekäme
     sonst einen weißen Block auf dunkler Seite. Das Kopf-Skript setzt
     data-theme aus ?theme= oder — ohne Angabe — aus dem System-Thema. */
  :root[data-theme="light"] {
    color-scheme: light;
    --void:#FBFBFC; --slate:#FFFFFF;
    --platinum:#12161B; --silver:#545C66; --muted:#69717A;
    --line: rgba(18,22,27,.10); --line-strong: rgba(18,22,27,.19);
    --glow-soft: rgba(120,155,200,.13);
    --chrome-0:#2A2E35; --chrome-1:#101216; --chrome-2:#3A404A;
    --chrome-3:#14171C; --chrome-4:#22262D;
    --karte: linear-gradient(168deg, rgba(18,22,27,.028), rgba(18,22,27,0) 55%);
    --amb-lila: rgba(140, 122, 214, .22);
    --amb-pink: rgba(214, 132, 182, .17);
    --amb-blau: rgba(120, 142, 214, .17);
    --amb-lila-in: rgba(140, 122, 214, .07);
    --amb-pink-in: rgba(214, 132, 182, .06);
    --amb-blau-in: rgba(120, 142, 214, .06);
  }


  /* ── Ambiente ────────────────────────────────────────────────────────
     Zwei große, sehr weiche Lichtwolken hinter der Karte. Niedrige Deckkraft
     und lange Laufzeit: Es soll wie Licht im Raum wirken, nicht wie ein
     Farbverlauf. Mit ?ambient=off bleibt alles monochrom.
  */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(52px);
    opacity: 0;
    transition: opacity .6s ease;
  }
  body.ambient::before {
    width: 62vw; height: 62vw;
    left: -14vw; top: -26vw;
    background: radial-gradient(circle, var(--amb-lila), transparent 68%);
    opacity: 1;
    animation: drift-a 54s ease-in-out infinite alternate;
  }
  /* Zwei Wolken in einem Element: CSS erlaubt mehrere Hintergründe,
     das spart ein zusätzliches Markup nur fürs Blau. */
  body.ambient::after {
    width: 74vw; height: 62vw;
    right: -16vw; bottom: -26vw;
    background:
      radial-gradient(circle at 72% 30%, var(--amb-pink), transparent 62%),
      radial-gradient(circle at 26% 78%, var(--amb-blau), transparent 64%);
    opacity: 1;
    animation: drift-b 68s ease-in-out infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0)        scale(1);    }
    to   { transform: translate3d(6vw, 4vw, 0)    scale(1.14); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0)        scale(1.08); }
    to   { transform: translate3d(-5vw, -3vw, 0)  scale(1);    }
  }

  /* Wer Bewegung reduziert, bekommt das Licht — nur ohne Wandern. */
  /* ── Nahtlos ─────────────────────────────────────────────────────────
     Standard für die Einbettung in Notion: Der Grund entspricht der
     Notion-Seite, die Karte verliert Rahmen, Rundung und Schatten. Damit
     sitzt der Inhalt auf der Seite statt in einem Kasten darauf.
     Mit ?card=1 kommt der Rahmen zurück — sinnvoll, wenn man das Widget
     allein im Browser öffnet.
  */
  body.nahtlos { background: var(--notion-grund); padding: 0; }
  body.nahtlos .card {
    background-color: transparent;
    background-image: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
    max-width: none;
  }
  body.nahtlos .card::before { display: none; }

  /* Kein Ambiente-Licht im nahtlosen Modus.
     Ohne Karte füllt es sonst den kompletten Einbettungsrahmen und legt einen
     farbigen Block auf die Seite — das Gegenteil von verschmelzen. Die
     Lichtstimmung trägt das Cover darüber; hier bleibt reiner Inhalt. */
  body.nahtlos::before,
  body.nahtlos::after { display: none; }

  /* Eng gesetzt, damit im Einbettungsrahmen kein leeres Band entsteht. */
  body.nahtlos .card { padding: 4px 2px; }

  @media (prefers-reduced-motion: reduce) {
    body.ambient::before,
    body.ambient::after { animation: none; }
  }


  /* Schimmer auf der Kartenfläche. Nur bei eingeschaltetem Ambiente —
     ohne bleibt die Karte exakt so, wie sie vorher war. */
  body.ambient .card::before {
    background:
      radial-gradient(56% 62% at 10%  0%,   var(--amb-lila-in), transparent 70%),
      radial-gradient(52% 62% at 90%  8%,   var(--amb-pink-in), transparent 70%),
      radial-gradient(64% 60% at 48% 100%,  var(--amb-blau-in), transparent 70%);
  }

  .card { z-index: 1; }

  :root { --notion-grund: #191919; }
  :root[data-theme="light"] { --notion-grund: #FFFFFF; }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }

  body {
    background: var(--void);
    color: var(--platinum);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; -webkit-font-smoothing:antialiased;
  }

  .card {
    position:relative;
    width:100%; max-width:420px;
    background-color: var(--slate);
    background-image: var(--karte);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 28px 22px;
    overflow:hidden;
    text-align:center;
  }
  .card::before {
    content:""; position:absolute; inset:-40% -10% auto -10%; height:160%;
    background: radial-gradient(60% 50% at 50% 0%, var(--glow-soft), transparent 70%);
    pointer-events:none;
  }

  .head {
    position:relative;
    font-size:11px; letter-spacing:.19em; text-transform:uppercase;
    color: var(--muted); margin-bottom:16px;
  }

  .ringwrap { position:relative; width:190px; height:190px; margin:0 auto 6px; }
  .ring { transform: rotate(-90deg); }
  .ring .track { fill:none; stroke:var(--line-strong); stroke-width:3; }
  .ring .fill  {
    fill:none; stroke:var(--silver); stroke-width:3; stroke-linecap:round;
    transition: stroke-dashoffset .4s linear;
  }

  .readout {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }
  .time {
    font-family:'Instrument Serif','Iowan Old Style',Georgia,serif;
    font-size:46px; line-height:1; font-variant-numeric:tabular-nums;
    background:linear-gradient(112deg,var(--chrome-0) 0%,var(--chrome-1) 22%,
               var(--chrome-2) 44%,var(--chrome-0) 62%,var(--chrome-4) 82%,var(--chrome-3) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .phase { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--silver); }

  .controls { position:relative; display:flex; gap:8px; justify-content:center; margin-top:16px; }

  button {
    font:inherit; font-size:12px; letter-spacing:.05em;
    color:var(--platinum);
    background:transparent;
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:8px 16px;
    cursor:pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  button:hover { background:rgba(150,180,215,.10); border-color:var(--silver); }
  button:focus-visible { outline:2px solid var(--silver); outline-offset:2px; }
  button.primary { border-color:var(--silver); }

  .rounds {
    position:relative;
    margin-top:14px; font-size:11px; color:var(--muted); letter-spacing:.04em;
  }

  @media (max-width:420px) {
    .ringwrap { width:160px; height:160px; }
    .time { font-size:38px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">Fokus</div>

    <div class="ringwrap">
      <svg class="ring" width="190" height="190" viewBox="0 0 190 190" aria-hidden="true">
        <circle class="track" cx="95" cy="95" r="88"/>
        <circle class="fill" id="ring" cx="95" cy="95" r="88"/>
      </svg>
      <div class="readout">
        <div class="time" id="time">25:00</div>
        <div class="phase" id="phase">Arbeit</div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="toggle">Start</button>
      <button id="reset">Zurücksetzen</button>
      <button id="skip">Überspringen</button>
    </div>

    <div class="rounds" id="rounds">Noch keine Runde abgeschlossen</div>
  </div>

<script>
(function () {
  "use strict";

  // Längen über die URL anpassbar: ?work=50&break=10&long=20&every=3
  var params  = new URLSearchParams(location.search);
  // Ambiente-Licht. Standard an, mit ?ambient=off aus.
  if ((params.get("ambient") || "on") !== "off") {
    document.body.classList.add("ambient");
  }

  // Nahtlos ist der Standard: In Notion soll das Widget Teil der Seite sein,
  // kein aufgesetzter Kasten. ?card=1 stellt den Rahmen wieder her.
  if (params.get("card") !== "1") {
    document.body.classList.add("nahtlos");
  }

  var num     = function (key, fallback) {
    var v = parseInt(params.get(key), 10);
    return Number.isFinite(v) && v > 0 && v <= 180 ? v : fallback;
  };

  var WORK       = num("work", 25) * 60;
  var BREAK      = num("break", 5) * 60;
  var LONG_BREAK = num("long", 15) * 60;
  var EVERY      = num("every", 4);

  var RADIUS = 88;
  var CIRC   = 2 * Math.PI * RADIUS;

  var elTime   = document.getElementById("time");
  var elPhase  = document.getElementById("phase");
  var elRing   = document.getElementById("ring");
  var elToggle = document.getElementById("toggle");
  var elRounds = document.getElementById("rounds");

  elRing.style.strokeDasharray = CIRC;

  var phase     = "work";   // work | break | long
  var total     = WORK;
  var remaining = WORK;
  var running   = false;
  var endsAt    = 0;        // Zeitstempel statt Zähler — übersteht Tabwechsel
  var completed = 0;
  var ticker    = null;

  var LABEL = { work: "Arbeit", break: "Pause", long: "Lange Pause" };

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function paint() {
    var secs = Math.max(0, Math.round(remaining));
    var text = pad(Math.floor(secs / 60)) + ":" + pad(secs % 60);

    elTime.textContent = text;
    elPhase.textContent = LABEL[phase];
    elRing.style.strokeDashoffset = CIRC * (1 - (total ? secs / total : 0));

    // Im Notion-Embed ist der Titel nicht sichtbar, im eigenen Tab schon.
    document.title = (running ? text + " · " : "") + "Novera Fokus";

    elRounds.textContent = completed === 0
      ? "Noch keine Runde abgeschlossen"
      : completed === 1 ? "1 Runde abgeschlossen"
      : completed + " Runden abgeschlossen";
  }

  function setPhase(next) {
    phase = next;
    total = next === "work" ? WORK : next === "break" ? BREAK : LONG_BREAK;
    remaining = total;
  }

  function advance() {
    if (phase === "work") {
      completed++;
      setPhase(completed % EVERY === 0 ? "long" : "break");
    } else {
      setPhase("work");
    }
  }

  function tick() {
    remaining = (endsAt - Date.now()) / 1000;
    if (remaining <= 0) {
      advance();
      // Die nächste Phase läuft direkt weiter — Pausen, die man erst
      // starten muss, werden erfahrungsgemäß übersprungen.
      endsAt = Date.now() + total * 1000;
    }
    paint();
  }

  function start() {
    running = true;
    endsAt = Date.now() + remaining * 1000;
    elToggle.textContent = "Pause";
    clearInterval(ticker);
    ticker = setInterval(tick, 250);
    paint();
  }

  function stop() {
    running = false;
    clearInterval(ticker);
    ticker = null;
    elToggle.textContent = "Start";
    paint();
  }

  elToggle.addEventListener("click", function () { running ? stop() : start(); });

  document.getElementById("reset").addEventListener("click", function () {
    stop();
    setPhase(phase);
    paint();
  });

  document.getElementById("skip").addEventListener("click", function () {
    var wasRunning = running;
    stop();
    advance();
    paint();
    if (wasRunning) start();
  });

  // Leertaste startet und pausiert, solange kein Knopf den Fokus hat.
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target === document.body) {
      e.preventDefault();
      running ? stop() : start();
    }
  });

  // Nach Tabwechsel oder Ruhezustand sofort nachziehen: die Restzeit ergibt
  // sich aus dem Zeitstempel, nicht aus der Zahl der verpassten Ticks.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && running) tick();
  });

  paint();
})();
</script>
</body>
</html>
