<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <!--
    Ambiente-Cover für das Dashboard.

    Graphit als Grund — die Novera-Fläche bleibt unverändert. Darüber drei weiche
    Lichtwolken: Lila, Pink und Blau.

    Das Blau liegt bewusst im Periwinkle-Bereich (#9DB2E8) und nicht auf dem
    reinen Markenblau #96B4D7: Gegen den fast schwarzen Grund kippt ein Blau mit
    Cyan-Anteil optisch ins Türkise. Periwinkle bleibt ein Blau und schlägt
    zugleich die Brücke zum Lila daneben.

    Alle drei Töne sind entsättigt: große Radien, niedrige Deckkraft. Es soll nach
    Licht im Raum aussehen, nicht nach einem Farbverlauf.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#12141C"/>
      <stop offset="55%"  stop-color="#141519"/>
      <stop offset="100%" stop-color="#191919"/>
    </linearGradient>

    <!-- Lila, oben links. Weicher als ein sattes Violett. -->
    <radialGradient id="lila" cx="18%" cy="2%" r="52%">
      <stop offset="0%"   stop-color="#AC9BF2" stop-opacity=".50"/>
      <stop offset="42%"  stop-color="#8E7DDC" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#8B7BD0" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink, rechts oben. Gedämpftes Rosé statt Magenta. -->
    <radialGradient id="pink" cx="76%" cy="8%" r="46%">
      <stop offset="0%"   stop-color="#F4A9DA" stop-opacity=".44"/>
      <stop offset="45%"  stop-color="#DC8AC2" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#D488B8" stop-opacity="0"/>
    </radialGradient>

    <!-- Blau, unten breit. Der Novera-Schimmer #96B4D7. -->
    <radialGradient id="blau" cx="44%" cy="30%" r="46%">
      <stop offset="0%"   stop-color="#93A9F2" stop-opacity=".42"/>
      <stop offset="45%"  stop-color="#7B8CE2" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#8592D6" stop-opacity="0"/>
    </radialGradient>

    <!-- Zweites Blau rechts unten, damit die Ecke nicht abfällt. -->
    <radialGradient id="blau2" cx="96%" cy="22%" r="34%">
      <stop offset="0%"   stop-color="#96A6F0" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#9AA8E4" stop-opacity="0"/>
    </radialGradient>

    <!--
      Unterkante läuft in Notions Seitengrund (#191919) aus.
      Ohne diesen Verlauf endet das Cover an einer sichtbaren Kante und wirkt
      wie ein aufgeklebtes Bild statt wie der obere Rand der Seite.
    -->
    <linearGradient id="auslauf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#191919" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#191919" stop-opacity=".45"/>
      <stop offset="62%"  stop-color="#191919" stop-opacity=".82"/>
      <stop offset="82%"  stop-color="#191919" stop-opacity=".97"/>
      <stop offset="100%" stop-color="#191919" stop-opacity="1"/>
    </linearGradient>

    <!-- Feines Korn. Ohne das wirken große Verläufe auf Displays gebändert. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>

    <!-- Lichtkante am unteren Rand, dort wo in Notion der Seitentitel sitzt. -->
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="26%"  stop-color="#C4B6F0" stop-opacity=".20"/>
      <stop offset="56%"  stop-color="#F0BEDA" stop-opacity=".18"/>
      <stop offset="82%"  stop-color="#A8C4E4" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="600" fill="url(#base)"/>
  <rect width="1500" height="600" fill="url(#lila)"/>
  <rect width="1500" height="600" fill="url(#pink)"/>
  <rect width="1500" height="600" fill="url(#blau)"/>
  <rect width="1500" height="600" fill="url(#blau2)"/>

  <rect x="0" y="230" width="1500" height="370" fill="url(#auslauf)"/>
  <rect x="0" y="596" width="1500" height="1.5" fill="url(#hairline)" opacity=".5"/>
  <rect width="1500" height="600" filter="url(#grain)" opacity=".9"/>
</svg>
