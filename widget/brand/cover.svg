<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600">
  <!--
    Ambiente-Cover für die HQ-Seite.
    Graphit als Grund, darüber drei weiche Lichtwolken in Violett, Rosé und einem
    warmen Ton. Niedrige Deckkraft, große Radien: Es soll nach Licht im Raum
    aussehen, nicht nach einem Farbverlauf.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0E1014"/>
      <stop offset="55%"  stop-color="#0A0B0D"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>

    <radialGradient id="violet" cx="22%" cy="15%" r="62%">
      <stop offset="0%"   stop-color="#7A5CFF" stop-opacity=".42"/>
      <stop offset="45%"  stop-color="#6244D6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6244D6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rose" cx="72%" cy="30%" r="55%">
      <stop offset="0%"   stop-color="#FF7AB8" stop-opacity=".30"/>
      <stop offset="45%"  stop-color="#D9558F" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#D9558F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ember" cx="50%" cy="96%" r="52%">
      <stop offset="0%"   stop-color="#FF9E6B" stop-opacity=".16"/>
      <stop offset="60%"  stop-color="#C96A4A" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#C96A4A" stop-opacity="0"/>
    </radialGradient>

    <!-- Kühler Gegenpol, damit es nicht ins Süßliche kippt -->
    <radialGradient id="cool" cx="92%" cy="82%" r="42%">
      <stop offset="0%"   stop-color="#96B4D7" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#96B4D7" stop-opacity="0"/>
    </radialGradient>

    <!-- Feines Korn. Ohne das wirken große Verläufe auf Displays gebändert. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#C9B8FF" stop-opacity=".22"/>
      <stop offset="62%"  stop-color="#FFC2DF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="600" fill="url(#base)"/>
  <rect width="1500" height="600" fill="url(#violet)"/>
  <rect width="1500" height="600" fill="url(#rose)"/>
  <rect width="1500" height="600" fill="url(#ember)"/>
  <rect width="1500" height="600" fill="url(#cool)"/>

  <!-- Lichtkante am unteren Rand, dort wo in Notion der Seitentitel sitzt -->
  <rect x="0" y="596" width="1500" height="1.5" fill="url(#hairline)"/>

  <rect width="1500" height="600" filter="url(#grain)" opacity=".9"/>
</svg>
