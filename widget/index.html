<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novera Studio — Command Center</title>
<link rel="icon" href="brand/favicon.svg">
<style>
  /* Schriften und Farben stammen aus dem Novera-Studio-Webauftritt
     (css/novera.css, fonts/). Nichts wird nachgebaut oder angenähert. */

  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('brand/inter-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('brand/instrument-serif-latin.woff2') format('woff2');
  }

  :root {
    color-scheme: dark;

    --void:      #08090B;
    --carbon:    #0C0E12;
    --slate:     #12151A;
    --elevated:  #171B21;

    --platinum:  #E9ECEF;
    --silver:    #98A1AD;
    --muted:     #939CA8;

    --line:        rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --glow:        rgba(150, 180, 215, 0.30);
    --glow-soft:   rgba(150, 180, 215, 0.15);

    /* Der Chrom-Verlauf der Marke. Liegt auf Logo und Uhrzeit. */
    --chrome-0: #FFFFFF;
    --chrome-1: #C3CAD4;
    --chrome-2: #868E99;
    --chrome-3: #E8ECF1;
    --chrome-4: #AAB2BD;

    --karte:     linear-gradient(168deg, rgba(255,255,255,.045), rgba(255,255,255,0) 55%);
    /* Ambiente-Licht. Gedämpftes Violett und Rosé, kein Neon. */
    --amb-violet: rgba(122, 92, 255, .30);
    --amb-rose:   rgba(255, 122, 184, .22);
  }

  /* Der Hellmodus der Marke dreht den Verlauf ins Graphit. */
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --void:      #FBFBFC;
      --carbon:    #F3F4F6;
      --slate:     #FFFFFF;
      --elevated:  #FFFFFF;
      --platinum:  #12161B;
      --silver:    #545C66;
      --muted:     #69717A;
      --line:        rgba(18, 22, 27, .10);
      --line-strong: rgba(18, 22, 27, .19);
      --glow:        rgba(120, 155, 200, .24);
      --glow-soft:   rgba(120, 155, 200, .13);
      --chrome-0: #2A2E35;
      --chrome-1: #101216;
      --chrome-2: #3A404A;
      --chrome-3: #14171C;
      --chrome-4: #22262D;
      --karte:   linear-gradient(168deg, rgba(18,22,27,.028), rgba(18,22,27,0) 55%);
      --amb-violet: rgba(122, 92, 255, .16);
      --amb-rose:   rgba(255, 122, 184, .13);
    }
  }


  /* ── Ambiente ────────────────────────────────────────────────────────
     Zwei große, sehr weiche Lichtwolken hinter der Karte. Niedrige Deckkraft
     und lange Laufzeit: Es soll wie Licht im Raum wirken, nicht wie ein
     Farbverlauf. Mit ?ambient=off bleibt alles monochrom.
  */
  body::before,
  body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(70px);
    opacity: 0;
    transition: opacity .6s ease;
  }
  body.ambient::before {
    width: 62vw; height: 62vw;
    left: -14vw; top: -26vw;
    background: radial-gradient(circle, var(--amb-violet), transparent 68%);
    opacity: 1;
    animation: drift-a 54s ease-in-out infinite alternate;
  }
  body.ambient::after {
    width: 54vw; height: 54vw;
    right: -12vw; bottom: -24vw;
    background: radial-gradient(circle, var(--amb-rose), transparent 68%);
    opacity: 1;
    animation: drift-b 68s ease-in-out infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0)        scale(1);    }
    to   { transform: translate3d(6vw, 4vw, 0)    scale(1.14); }
  }
  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0)        scale(1.08); }
    to   { transform: translate3d(-5vw, -3vw, 0)  scale(1);    }
  }

  /* Wer Bewegung reduziert, bekommt das Licht — nur ohne Wandern. */
  @media (prefers-reduced-motion: reduce) {
    body.ambient::before,
    body.ambient::after { animation: none; }
  }

  .card { z-index: 1; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--void);
    color: var(--platinum);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-feature-settings: "tnum" 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 940px;
    background-color: var(--slate);
    background-image: var(--karte);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    overflow: hidden;
  }

  /* Der kühle Schimmer aus dem Webauftritt. Nur Licht, nie Text. */
  .card::before {
    content: "";
    position: absolute;
    inset: -40% -10% auto -10%;
    height: 160%;
    background: radial-gradient(60% 50% at 20% 0%, var(--glow-soft), transparent 70%);
    pointer-events: none;
  }

  .brand { position: relative; display: flex; flex-direction: column; gap: 9px; min-width: 0; }

  .logo { display: block; height: 38px; width: auto; }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.19em;
    text-transform: uppercase;
    padding-left: 2px;
  }

  .when {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .digital {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  /* Analoguhr. Ohne Ziffern — die genaue Zeit steht daneben,
     das Zifferblatt liefert nur den Blick fürs Ungefähre. */
  .dial { width: 66px; height: 66px; flex: none; }
  .dial .face   { fill: none; stroke: var(--line-strong); stroke-width: 1; }
  .dial .tick   { stroke: var(--line-strong); stroke-width: 1.4; stroke-linecap: round; }
  .dial .hand   { stroke: var(--platinum); stroke-linecap: round; fill: none; }
  .dial .hour   { stroke-width: 2.6; }
  .dial .minute { stroke-width: 1.8; }
  .dial .second { stroke: var(--silver); stroke-width: 1; }
  .dial .pin    { fill: var(--platinum); }

  .clock {
    font-family: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
    font-size: 52px;
    line-height: 1;
    letter-spacing: 0.005em;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(112deg,
                var(--chrome-0) 0%, var(--chrome-1) 22%, var(--chrome-2) 44%,
                var(--chrome-0) 62%, var(--chrome-4) 82%, var(--chrome-3) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* Die Sekunden bekommen eine eigene Farbe statt den Chrom-Verlauf zu erben:
     ein eigenes opacity erzeugt eine neue Composited-Layer, und darin greift
     background-clip:text des Elternelements nicht mehr — der Text wäre unsichtbar. */
  .clock .sec {
    font-size: 26px;
    color: var(--silver);
    -webkit-text-fill-color: var(--silver);
  }

  .date {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .weekday { color: var(--silver); font-weight: 600; }

  .rule {
    height: 1px;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
  }

  /* Notion zieht Embeds oft schmal — dann untereinander. */
  @media (max-width: 620px) {
    body { padding: 12px; }
    .card {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      padding: 20px;
    }
    .when { align-items: center; gap: 16px; }
    .digital { text-align: left; align-items: flex-start; }
    .clock { font-size: 42px; }
    .logo { height: 32px; }
    .dial { width: 54px; height: 54px; }
  }
</style>
</head>
<body>

    <div class="when">

      <div class="digital">

<script>
(function () {
  "use strict";

  // Sprache über ?lang=de|en, sonst Browsersprache. Standard ist Deutsch
  // mit 24-Stunden-Anzeige; ?h12=1 schaltet auf 12 Stunden.
  var params = new URLSearchParams(location.search);
  // Ambiente-Licht. Standard an, mit ?ambient=off aus.
  if ((params.get("ambient") || "on") !== "off") {
    document.body.classList.add("ambient");
  }

  var lang = params.get("lang") || (navigator.language || "de").slice(0, 2);
  var locale = lang === "en" ? "en-US" : "de-DE";
  var hour12 = params.get("h12") === "1" || (lang === "en" && params.get("h12") !== "0");

  // Zwölf Striche statt Ziffern — einmal erzeugt, danach unverändert.
  var ticks = document.getElementById("ticks");
  if (ticks) {
    var marks = "";
    for (var t = 0; t < 12; t++) {
      var len = t % 3 === 0 ? 8 : 4;
      marks += '<line x1="50" y1="' + (8 + (t % 3 === 0 ? 0 : 2)) +
               '" x2="50" y2="' + (8 + len) +
               '" transform="rotate(' + (t * 30) + ' 50 50)"/>';
    }
    ticks.innerHTML = marks;
  }

  var handHour   = document.getElementById("handHour");
  var handMinute = document.getElementById("handMinute");
  var handSecond = document.getElementById("handSecond");

  var elClock   = document.getElementById("clock");
  var elWeekday = document.getElementById("weekday");
  var elDate    = document.getElementById("date");

  var dayFmt  = new Intl.DateTimeFormat(locale, { weekday: "long" });
  var dateFmt = new Intl.DateTimeFormat(locale, { day: "numeric", month: "long", year: "numeric" });

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function render() {
    var now = new Date();
    var h = now.getHours();
    var suffix = "";

    if (hour12) {
      suffix = h < 12 ? " AM" : " PM";
      h = h % 12 || 12;
    }

    elClock.innerHTML =
      (hour12 ? h : pad(h)) + ":" + pad(now.getMinutes()) +
      '<span class="sec">:' + pad(now.getSeconds()) + suffix + "</span>";

    elWeekday.textContent = dayFmt.format(now);
    elDate.textContent = dateFmt.format(now);

    // Zeiger. Stunde und Minute laufen weich mit, damit 10:30 nicht
    // aussieht, als stünde der Stundenzeiger exakt auf der 10.
    var sec = now.getSeconds();
    var min = now.getMinutes() + sec / 60;
    var hr  = (now.getHours() % 12) + min / 60;

    if (handHour)   handHour.setAttribute("transform",   "rotate(" + hr * 30  + " 50 50)");
    if (handMinute) handMinute.setAttribute("transform", "rotate(" + min * 6  + " 50 50)");
    if (handSecond) handSecond.setAttribute("transform", "rotate(" + sec * 6  + " 50 50)");
  }

  render();

  // Auf die volle Sekunde einschwingen, danach im Sekundentakt.
  // Ein reines setInterval(1000) driftet über Stunden sichtbar ab.
  setTimeout(function tick() {
    render();
    setTimeout(tick, 1000 - (Date.now() % 1000));
  }, 1000 - (Date.now() % 1000));

  // Nach Ruhezustand oder Tabwechsel sofort nachziehen.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render();
  });
})();
</script>
</body>
</html>
